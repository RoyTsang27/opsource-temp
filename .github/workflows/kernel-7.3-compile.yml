name: Linux 7.3 compile checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-7.3-compile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  kernel:
    name: Compile ${{ matrix.subtarget }} kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mediatek
            subtarget: filogic
            arch: arm64
            cross: aarch64-linux-gnu-
            compiler: gcc-aarch64-linux-gnu
            libc: libc6-dev-arm64-cross
            image: Image
          - target: ramips
            subtarget: mt76x8
            arch: mips
            cross: mipsel-linux-gnu-
            compiler: gcc-mipsel-linux-gnu
            libc: libc6-dev-mipsel-cross
            image: vmlinux
    env:
      TARGET: ${{ matrix.target }}
      SUBTARGET: ${{ matrix.subtarget }}
      ARCH: ${{ matrix.arch }}
      CROSS_COMPILE: ${{ matrix.cross }}
      COMPILER: ${{ matrix.compiler }}
      LIBC: ${{ matrix.libc }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install kernel build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$COMPILER" "$LIBC" autoconf automake bc bison build-essential flex libelf-dev \
            libssl-dev libtool patch python3 rsync xz-utils zstd
      - name: Read pinned kernel version
        id: source
        run: |
          python3 scripts/device-build.py check-source
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('config/device-build.json').read_text())
          print('version=' + data['kernel'])
          print('sha256=' + data['kernel_sha256'])
          PY
      - name: Download and verify Linux
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          mkdir -p logs
          curl --fail --location --retry 3 \
            "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-$VERSION.tar.xz" \
            --output "$RUNNER_TEMP/linux.tar.xz"
          printf '%s  %s\n' "$SHA256" "$RUNNER_TEMP/linux.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/kernel"
          tar -xJf "$RUNNER_TEMP/linux.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/kernel"
      - name: Apply source overlays and ordered patches
        run: |
          for overlay in generic/files generic/files-7.3 "$TARGET/files" "$TARGET/files-7.3"; do
            if [ -d "target/linux/$overlay" ]; then
              cp -a "target/linux/$overlay/." "$RUNNER_TEMP/kernel/"
            fi
          done
          for patches in generic/backport-7.3 generic/pending-7.3 generic/hack-7.3 "$TARGET/patches-7.3"; do
            PATCH='patch --fuzz=0' scripts/patch-kernel.sh \
              "$RUNNER_TEMP/kernel" "target/linux/$patches" 2>&1 | tee -a logs/patches.log
          done
      - name: Audit all target-compatible kernel package definitions
        run: |
          python3 scripts/kernel-package-audit.py --kernel-tree "$RUNNER_TEMP/kernel" \
            --arch "$ARCH" --board "$TARGET" --subtarget "$SUBTARGET" \
            --json logs/package-audit.json 2>&1 | tee logs/package-audit.log
      - name: Resolve target kernel defaults
        run: |
          scripts/kconfig.pl + target/linux/generic/config-7.3 \
            "target/linux/$TARGET/$SUBTARGET/config-7.3" > "$RUNNER_TEMP/kernel/.config"
          # Supply dependencies normally selected by the tested OpenWrt packages.
          printf '%s\n' CONFIG_INPUT=m CONFIG_CRYPTO_CCM=m CONFIG_CRYPTO_CMAC=m \
            CONFIG_CRYPTO_GCM=m CONFIG_CRC_CCITT=m CONFIG_RELAY=y CONFIG_HWMON=y \
            >> "$RUNNER_TEMP/kernel/.config"
          make -C "$RUNNER_TEMP/kernel" listnewconfig 2>&1 | tee logs/new-options.log
          make -C "$RUNNER_TEMP/kernel" olddefconfig 2>&1 | tee logs/configure.log
          cp "$RUNNER_TEMP/kernel/.config" logs/kernel.config
      - name: Compile ATM library and PVC tools against Linux headers
        run: |
          make -C "$RUNNER_TEMP/kernel" \
            INSTALL_HDR_PATH="$RUNNER_TEMP/uapi" headers_install
          curl --fail --location --retry 3 \
            https://sources.openwrt.org/linux-atm-2.5.2.tar.gz \
            --output "$RUNNER_TEMP/linux-atm.tar.gz"
          printf '%s  %s\n' \
            9645481a2b16476b59220aa2d6bc5bc41043f291326c9b37581018fbd16dd53a \
            "$RUNNER_TEMP/linux-atm.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/linux-atm"
          tar -xzf "$RUNNER_TEMP/linux-atm.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/linux-atm"
          PATCH='patch --fuzz=0' scripts/patch-kernel.sh \
            "$RUNNER_TEMP/linux-atm" package/network/utils/linux-atm/patches \
            2>&1 | tee logs/atm-patches.log
          (
            cd "$RUNNER_TEMP/linux-atm"
            trap 'cp -f config.log "$GITHUB_WORKSPACE/logs/atm-config.log" 2>/dev/null || true' EXIT
            autoreconf --force --install
            ac_cv_header_linux_atmsvc_h=no \
              CC="${CROSS_COMPILE}gcc" CPPFLAGS="-I$RUNNER_TEMP/uapi/include" \
              ./configure --host="${CROSS_COMPILE%-}" --prefix=/usr
            make -j"$(nproc)"
            make DESTDIR="$RUNNER_TEMP/atm-install" install
            test -f "$RUNNER_TEMP/atm-install/usr/lib/libatm.so"
            test -x "$RUNNER_TEMP/atm-install/usr/sbin/br2684ctl"
          ) 2>&1 | tee logs/atm-compile.log
      - name: Check libbpf and bpftool against exported kernel headers
        run: |
          curl --fail --location --retry 3 \
            https://sources.openwrt.org/libbpf-1.7.0.tar.zst \
            --output "$RUNNER_TEMP/libbpf.tar.zst"
          printf '%s  %s\n' \
            30fbb65adcb4ce7e5eac797edbb81ede5e00969f8eb6a871b9e7913eda4e8ba4 \
            "$RUNNER_TEMP/libbpf.tar.zst" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/libbpf"
          tar --zstd -xf "$RUNNER_TEMP/libbpf.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/libbpf"
          PATCH='patch --fuzz=0' scripts/patch-kernel.sh \
            "$RUNNER_TEMP/libbpf" package/libs/libbpf/patches \
            2>&1 | tee logs/libbpf-patches.log
          printf '%s\n' '#include <linux/types.h>' '#include <linux/bpf_perf_event.h>' \
            '#ifdef __SIZEOF_INT128__' \
            '_Static_assert(sizeof(__u128) == 16 && _Alignof(__u128) == 16, "UAPI int128 ABI");' \
            '#endif' > "$RUNNER_TEMP/libbpf-uapi.c"
          "${CROSS_COMPILE}gcc" -std=gnu11 -Wall -Werror -fsyntax-only \
            -I"$RUNNER_TEMP/libbpf/include" -I"$RUNNER_TEMP/libbpf/include/uapi" \
            -I"$RUNNER_TEMP/uapi/include" "$RUNNER_TEMP/libbpf-uapi.c" \
            2>&1 | tee logs/libbpf-uapi.log
          curl --fail --location --retry 3 \
            https://sources.openwrt.org/bpftool-7.7.0.tar.zst \
            --output "$RUNNER_TEMP/bpftool.tar.zst"
          printf '%s  %s\n' \
            67402950366f03853edb9a8702e1701b206f5f6685d887e9873264b14894f062 \
            "$RUNNER_TEMP/bpftool.tar.zst" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/bpftool"
          tar --zstd -xf "$RUNNER_TEMP/bpftool.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/bpftool"
          PATCH='patch --fuzz=0' scripts/patch-kernel.sh \
            "$RUNNER_TEMP/bpftool" package/network/utils/bpftool/patches \
            2>&1 | tee logs/bpftool-patches.log
          for includes in include libbpf/include; do
            "${CROSS_COMPILE}gcc" -std=gnu11 -Wall -Werror -fsyntax-only \
              -I"$RUNNER_TEMP/bpftool/$includes" -I"$RUNNER_TEMP/bpftool/$includes/uapi" \
              -I"$RUNNER_TEMP/uapi/include" "$RUNNER_TEMP/libbpf-uapi.c" \
              2>&1 | tee -a logs/bpftool-uapi.log
          done
      - name: Compile kernel and built-in drivers
        run: |
          make -C "$RUNNER_TEMP/kernel" -j"$(nproc)" "$IMAGE" modules \
            2>&1 | tee logs/compile.log
      - name: Compile local external kernel modules
        run: |
          (
            modules='button-hotplug gpio-button-hotplug trelay ubootenv-nvram'
            if [ "$SUBTARGET" = filogic ]; then
              modules="$modules leds-gca230718 leds-ws2812b"
            fi
            build_status=0
            for module in $modules; do
              destination="$RUNNER_TEMP/modules/$module"
              mkdir -p "$destination"
              cp -a "package/kernel/$module/src/." "$destination/"
              make -C "$RUNNER_TEMP/kernel" M="$destination" modules || build_status=1
            done
            exit "$build_status"
          ) 2>&1 | tee logs/external-modules.log
      - name: Compile pinned mac80211 and MediaTek wireless drivers
        run: bash scripts/ci-wireless-compile.sh 2>&1 | tee logs/wireless-compile.log
      - name: Upload kernel diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-7.3-${{ matrix.subtarget }}-diagnostics
          path: logs/*
          if-no-files-found: ignore
          retention-days: 7
