name: Compile Airoha kernels

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kernel-prepare-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Compile ${{ matrix.target }} kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [an7581, an7583]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential bzip2 clang cmake cpio flex bison \
            g++ gawk gcc-multilib g++-multilib gettext git libelf-dev \
            libncurses-dev libssl-dev libtool pkgconf python3 python3-setuptools \
            rsync swig texinfo unzip zlib1g-dev file wget curl xz-utils zstd device-tree-compiler
      - name: Prepare kernel and apply patch stack
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cp feeds.conf.release feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Check target defaults independently of the saved device profiles.
          printf 'CONFIG_TARGET_airoha=y\nCONFIG_TARGET_airoha_%s=y\n' "$TARGET" > .config
          cat configs/release.config >> .config
          make defconfig
          python3 scripts/check-release.py --pon-config .config
          profile="configs/$TARGET.config"
          if [ "$TARGET" = an7581 ]; then
            profile=configs/an7581-tcboot.config
          fi
          ./scripts/kconfig.pl + "$profile" configs/release.config > .config
          make defconfig
          python3 scripts/check-release.py --config .config
          make target/linux/prepare -j"$(nproc)" V=s
          python3 scripts/check-kernel-patches.py \
            build_dir/target-*/linux-airoha_"$TARGET"/linux-[0-9]*
      - name: Build host tools and cross compiler
        run: |
          set -o pipefail
          make tools/install -j"$(nproc)" V=s 2>&1 | tee tools-build.log
          make toolchain/install -j"$(nproc)" V=s 2>&1 | tee toolchain-build.log
      - name: Compile kernel and modules
        run: |
          set -o pipefail
          make target/linux/compile -j"$(nproc)" V=s 2>&1 | tee kernel-build.log
      - name: Compile integrated PON drivers and userspace packages
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s \
            package/pon/drivers/airoha-pon-frontends/compile \
            package/pon/drivers/airoha-xpon/compile \
            package/pon/userspace/airoha-ponctl/compile \
            package/pon/userspace/airoha-pon-daemons/compile \
            package/pon/userspace/airoha-pon-debug/compile \
            package/pon/userspace/luci-app-pon/compile \
            package/pon/userspace/luci-app-iptv/compile 2>&1 | tee pon-build.log
      - name: Build and verify XG-040G-MD tcboot factory and sysupgrade images
        if: matrix.target == 'an7581'
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee tcboot-image-build.log
          python3 scripts/check-tcboot-image.py \
            bin/targets/airoha/an7581/*nokia_xg-040g-md-tcboot-squashfs-factory.bin
          bash scripts/verify-release.sh bin/targets/airoha/an7581
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-build-log-${{ matrix.target }}
          path: '*-build.log'
          if-no-files-found: ignore
          retention-days: 7
